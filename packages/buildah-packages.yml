name: Buildah packages and distributions
note: >-
  Buildah is a Go program, not a hosted API, so it publishes no client SDKs. What it
  distributes is (a) the Go module that IS the tool — imported directly by Podman and by
  other build tooling — and (b) OS packages built by Linux distributions. The Go module
  path was renamed from github.com/containers/buildah to go.podman.io/buildah when the
  project moved into the podman-container-tools GitHub organization under the CNCF
  Podman Container Tools project; both paths currently resolve on the Go module proxy to
  the same v1.45.0 tag and commit (7ae7d5a4021b24d02a5c281badca8c4d8ebbf442).
  No npm, PyPI, RubyGems, crates.io, NuGet or Maven package is published (probed; 404).
